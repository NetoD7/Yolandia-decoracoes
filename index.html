<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Yolandia Decorações</title>
<link rel="icon" type="image/png" href="favicon.png"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --roxo:#5B2A86;
  --roxo-dark:#3E1C5E;
  --turquesa:#17A9B0;
  --rosa:#EC1E79;
  --amarelo:#F7B500;
  --bg:#F6F4FA;
  --surface:#FFFFFF;
  --surface-2:#F0EBF7;
  --text:#241533;
  --text-mut:#6B6178;
  --border:#E4DEF0;
  --radius-sm:10px;
  --radius:14px;
  --radius-lg:20px;
  --shadow:0 4px 18px rgba(60,20,90,0.08);
  --shadow-lg:0 16px 40px rgba(60,20,90,0.14);
  --glass:rgba(255,255,255,0.72);
  --ok:#1FA96A;
  --warn:#F7B500;
  --danger:#E3453A;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
}
[data-theme="dark"]{
  --bg:#1B1123;
  --surface:#251633;
  --surface-2:#2E1C40;
  --text:#F3EEFA;
  --text-mut:#B6A9C7;
  --border:#3B2751;
  --shadow:0 4px 18px rgba(0,0,0,0.35);
  --shadow-lg:0 16px 40px rgba(0,0,0,0.45);
  --glass:rgba(37,22,51,0.72);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--text); transition:background .2s,color .2s; line-height:1.5; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
img{max-width:100%;}
button{font-family:inherit; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease, filter .15s ease;}
button:active{transform:translateY(1px);}
button:disabled{opacity:.5; cursor:not-allowed; transform:none;}
input,select,textarea{font-family:inherit; transition:border-color .15s ease, box-shadow .15s ease;}
:focus-visible{outline:2px solid var(--turquesa); outline-offset:2px; border-radius:4px;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--roxo);}

.hidden{display:none !important;}

/* ---------- LOGIN ---------- */
#loginScreen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,var(--roxo) 0%, var(--roxo-dark) 55%, #1a0d30 100%);
  padding:20px; position:relative; overflow:hidden;
}
#loginScreen::before, #loginScreen::after{
  content:''; position:absolute; border-radius:50%; filter:blur(60px); opacity:.35; pointer-events:none;
}
#loginScreen::before{width:340px; height:340px; background:var(--turquesa); top:-80px; left:-80px;}
#loginScreen::after{width:380px; height:380px; background:var(--rosa); bottom:-100px; right:-80px;}
.login-card{
  background:var(--surface); border-radius:var(--radius-lg); padding:44px 38px; width:100%; max-width:390px;
  box-shadow:0 24px 70px rgba(0,0,0,0.4); text-align:center; position:relative; z-index:1;
  border:1px solid rgba(255,255,255,0.08); animation:loginIn .4s cubic-bezier(.2,.8,.3,1);
}
@keyframes loginIn{from{opacity:0; transform:translateY(18px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);}}
.login-card img.logo{width:140px; margin-bottom:4px;}
.login-card h1{font-size:20px; color:var(--roxo); margin-bottom:2px;}
.login-card p.tag{color:var(--text-mut); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:26px;}
.field{text-align:left; margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--text-mut); margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%; padding:11px 13px; border-radius:10px; border:1.5px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:14px; outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--turquesa); box-shadow:0 0 0 3px rgba(23,169,176,0.15);}
.role-toggle{display:flex; gap:4px; margin-bottom:20px; background:var(--surface-2); padding:4px; border-radius:12px; border:1.5px solid var(--border);}
.role-toggle button{
  flex:1; padding:9px; border-radius:9px; border:none; background:transparent;
  color:var(--text-mut); font-weight:600; font-size:13px;
}
.role-toggle button.active{background:var(--surface); color:var(--roxo); box-shadow:0 3px 10px rgba(60,20,90,0.14);}
.btn-primary{
  width:100%; padding:13px; border:none; border-radius:12px; font-weight:700; font-size:14px;
  background:linear-gradient(135deg,var(--rosa),var(--roxo)); color:#fff; letter-spacing:.02em;
  box-shadow:0 8px 20px rgba(91,42,134,0.35);
}
.btn-primary:hover{box-shadow:0 12px 28px rgba(91,42,134,0.45); transform:translateY(-1px);}
.btn-primary:active{transform:scale(.98);}
.login-hint{margin-top:16px; font-size:11px; color:var(--text-mut);}

/* ---------- APP SHELL ---------- */
#appShell{display:none; min-height:100vh;}
#appShell.active{display:flex;}
.sidebar{
  width:240px; background:linear-gradient(180deg, var(--roxo-dark) 0%, #2c1449 100%); color:#fff; display:flex; flex-direction:column;
  flex-shrink:0; height:100vh; position:sticky; top:0; overflow-y:auto; box-shadow:2px 0 24px rgba(0,0,0,0.18); z-index:30;
}
.sidebar-brand{display:flex; align-items:center; gap:10px; padding:20px 18px; border-bottom:1px solid rgba(255,255,255,0.1);}
.sidebar-brand img{width:44px; height:44px; object-fit:contain; filter:drop-shadow(0 4px 10px rgba(0,0,0,0.25));}
.sidebar-brand .name{font-weight:800; font-size:15px; line-height:1.1; letter-spacing:.01em;}
.sidebar-brand .sub{font-size:9px; color:#D9C6EE; text-transform:uppercase; letter-spacing:.1em;}
.nav-list{list-style:none; padding:12px 10px; flex:1;}
.nav-list li{margin-bottom:3px;}
.nav-list button{
  width:100%; text-align:left; background:none; border:none; color:#E4D6F3; padding:10px 12px;
  border-radius:10px; font-size:13.5px; font-weight:500; display:flex; align-items:center; gap:10px;
  transition:background-color .15s ease, color .15s ease, transform .15s ease, box-shadow .15s ease;
}
.nav-list button:hover{background:rgba(255,255,255,0.09); transform:translateX(3px);}
.nav-list button.active{background:linear-gradient(135deg,var(--rosa),var(--turquesa)); color:#fff; font-weight:700; box-shadow:0 6px 16px rgba(236,30,121,0.32);}
.nav-list .ic{font-size:16px; width:18px; text-align:center;}
.sidebar-footer{padding:14px 18px; border-top:1px solid rgba(255,255,255,0.1); font-size:10.5px; color:#C7B4DD;}

.main{flex:1; display:flex; flex-direction:column; min-width:0;}
.topbar{
  background:var(--glass); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border); padding:14px 24px;
  display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20;
}

@media(max-width:900px){
  #appShell.active{flex-direction:column;}
  .sidebar{width:100%; height:auto; position:sticky; top:0; flex-direction:row; overflow-x:auto; overflow-y:hidden; box-shadow:0 2px 16px rgba(0,0,0,0.18);}
  .sidebar-brand{border-bottom:none; border-right:1px solid rgba(255,255,255,0.1); flex-shrink:0;}
  .sidebar-footer{display:none;}
  .nav-list{display:flex; padding:8px; gap:4px; flex:none;}
  .nav-list li{margin-bottom:0; flex-shrink:0;}
  .nav-list button{flex-direction:column; gap:2px; font-size:10px; padding:8px 10px; white-space:nowrap;}
  .nav-list button:hover{transform:translateY(-2px);}
  .nav-list .ic{font-size:17px;}
}
.topbar h2{font-size:19px; color:var(--roxo); display:flex; align-items:center; gap:8px;}
[data-theme="dark"] .topbar h2{color:#D9B8F0;}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.icon-btn{
  width:36px; height:36px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--text);
}
.user-chip{display:flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; border-radius:20px; background:var(--surface-2); font-size:12.5px; font-weight:600;}
.user-chip .av{width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,var(--rosa),var(--amarelo)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:12px;}

.content{padding:22px 24px 60px; flex:1;}
.footer-brand{text-align:center; padding:16px; font-size:11px; color:var(--text-mut); border-top:1px solid var(--border);}

/* ---------- COMPONENTS ---------- */
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:700px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.card{background:var(--surface); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); border:1px solid var(--border); transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease;}
.stat-card{position:relative; overflow:hidden; cursor:default;}
.stat-card:hover{transform:translateY(-3px); box-shadow:0 12px 30px rgba(60,20,90,0.16); border-color:var(--turquesa);}
.stat-card .stat-ic{width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:19px; margin-bottom:10px;}
.stat-card .stat-val{font-size:26px; font-weight:800;}
.stat-card .stat-lbl{font-size:12px; color:var(--text-mut); font-weight:600;}

.btn{padding:9px 16px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text); font-weight:600; font-size:13px; display:inline-flex; align-items:center; gap:6px;}
.btn:hover{filter:brightness(0.97); border-color:var(--turquesa);}
.btn-brand{background:linear-gradient(135deg,var(--rosa),var(--roxo)); color:#fff; border:none; box-shadow:0 6px 16px rgba(91,42,134,0.3);}
.btn-brand:hover{box-shadow:0 10px 24px rgba(91,42,134,0.42); transform:translateY(-1px); filter:none; border-color:transparent;}
.btn-turq{background:linear-gradient(135deg,var(--turquesa),#0E7B80); color:#fff; border:none;}
.btn-turq:hover{box-shadow:0 10px 22px rgba(23,169,176,0.38); transform:translateY(-1px); filter:none; border-color:transparent;}
.btn-sm{padding:6px 10px; font-size:12px; border-radius:8px;}
.btn-danger{background:var(--danger); color:#fff; border:none;}
.btn-danger:hover{box-shadow:0 8px 18px rgba(227,69,58,0.35); filter:none; border-color:transparent;}
.btn-ghost{background:transparent; border:1.5px dashed var(--border);}
.btn-ghost:hover{border-color:var(--roxo); background:var(--surface-2); border-style:dashed;}

.toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
.toolbar .search{flex:1; min-width:180px;}
.search input{width:100%; padding:9px 14px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text); font-size:13px;}
.tabs{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; background:var(--surface-2); padding:5px; border-radius:12px; border:1px solid var(--border); width:fit-content;}
.tabs button{padding:8px 16px; border-radius:8px; border:none; background:transparent; font-size:12.5px; font-weight:600; color:var(--text-mut); transition:background-color .15s ease, color .15s ease, box-shadow .15s ease;}
.tabs button.active{background:var(--surface); color:var(--roxo); box-shadow:0 3px 10px rgba(60,20,90,0.12);}

table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{text-align:left; padding:12px; color:var(--text-mut); font-size:11px; text-transform:uppercase; letter-spacing:.05em; border-bottom:2px solid var(--border); background:var(--surface-2); position:sticky; top:0; z-index:1;}
tbody td{padding:12px; border-bottom:1px solid var(--border);}
tbody tr{transition:background-color .12s ease;}
tbody tr:hover{background:var(--surface-2);}
.table-wrap{overflow-x:auto; background:var(--surface); border-radius:var(--radius-lg); border:1px solid var(--border); box-shadow:var(--shadow);}

.badge{display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.01em;}
.badge.ok{background:rgba(31,169,106,.14); color:var(--ok);}
.badge.warn{background:rgba(247,181,0,.16); color:#946400;}
.badge.danger{background:rgba(227,69,58,.14); color:var(--danger);}
.badge.info{background:rgba(23,169,176,.15); color:#0C7278;}
.badge.muted{background:var(--surface-2); color:var(--text-mut);}
.badge.purple{background:rgba(91,42,134,.13); color:var(--roxo);}
[data-theme="dark"] .badge.purple{color:#D9B8F0;}

/* ---------- DASHBOARD (ENTERPRISE) ---------- */
.dash-head{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:24px;}
.dash-eyebrow{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--turquesa); margin-bottom:4px;}
.dash-title{font-size:26px; font-weight:800; color:var(--text); letter-spacing:-.01em;}
.dash-sub{font-size:13px; color:var(--text-mut); margin-top:2px; text-transform:capitalize;}
.dash-head-actions{display:flex; gap:10px;}

.dkpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
@media(max-width:1100px){.dkpi-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.dkpi-grid{grid-template-columns:1fr;}}
.dkpi-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px;
  box-shadow:var(--shadow); transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  opacity:0; animation:dkpiIn .45s ease forwards;
}
@keyframes dkpiIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.dkpi-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:var(--turquesa);}
.dkpi-ic{width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:19px; margin-bottom:14px;}
.dkpi-val{font-size:27px; font-weight:800; letter-spacing:-.01em; line-height:1.1;}
.dkpi-lbl{font-size:12.5px; color:var(--text-mut); font-weight:600; margin-top:4px;}
.dkpi-meta{font-size:11px; color:var(--text-mut); margin-top:10px; padding-top:10px; border-top:1px solid var(--border);}

.dash-charts{display:grid; grid-template-columns:1.4fr 1fr; gap:16px; margin-top:24px;}
@media(max-width:900px){.dash-charts{grid-template-columns:1fr;}}
.chart-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:22px;}
.chart-card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:18px;}
.chart-card-head h3{font-size:15px; font-weight:800; color:var(--text);}
.chart-card-head p{font-size:12px; color:var(--text-mut); margin-top:2px;}

.dash-section-title{font-size:15px; font-weight:800; color:var(--text); margin-bottom:14px; padding-left:2px;}

.insight-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media(max-width:900px){.insight-grid{grid-template-columns:1fr;}}
.insight-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:18px; transition:box-shadow .2s ease, transform .2s ease;}
.insight-card:hover{box-shadow:var(--shadow-lg); transform:translateY(-2px);}
.insight-head{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.insight-ic{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
.insight-head h4{font-size:13.5px; font-weight:700; color:var(--text);}
.insight-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
.insight-row:last-child{border-bottom:none;}
.insight-val{font-weight:700; color:var(--text-mut);}
.insight-val.warn{color:var(--danger);}

.thumb{width:40px; height:40px; border-radius:9px; object-fit:cover; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:16px;}

.empty-state{text-align:center; padding:50px 20px; color:var(--text-mut);}
.empty-state .em-ic{font-size:38px; margin-bottom:10px;}
.empty-state .em-t{font-weight:700; color:var(--text); margin-bottom:4px;}

/* Modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,10,30,0.55); display:none; align-items:center; justify-content:center;
  z-index:100; padding:20px;
}
.modal-overlay.active{display:flex; animation:overlayIn .18s ease;}
@keyframes overlayIn{from{background:rgba(20,10,30,0);} to{background:rgba(20,10,30,0.55);}}
.modal{background:var(--surface); border-radius:18px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; box-shadow:0 30px 80px rgba(0,0,0,0.4); animation:modalIn .22s cubic-bezier(.2,.8,.3,1);}
@keyframes modalIn{from{opacity:0; transform:translateY(14px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);}}
.modal.wide{max-width:860px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:2;}
.modal-head h3{font-size:16px;}
.modal-close{width:30px; height:30px; border-radius:8px; border:none; background:var(--surface-2); font-size:16px;}
.modal-body{padding:20px 22px;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; position:sticky; bottom:0; background:var(--surface);}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media(max-width:560px){.form-row{grid-template-columns:1fr;}}

.toast-wrap{position:fixed; top:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--surface); border-left:4px solid var(--turquesa); box-shadow:var(--shadow); border-radius:10px; padding:12px 16px; font-size:13px; min-width:220px; animation:slideIn .25s ease;}
.toast.ok{border-color:var(--ok);}
.toast.err{border-color:var(--danger);}
@keyframes slideIn{from{transform:translateX(30px); opacity:0;} to{transform:translateX(0); opacity:1;}}

/* calendar */
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-dow{text-align:center; font-size:11px; font-weight:700; color:var(--text-mut); padding-bottom:4px;}
.cal-cell{min-height:86px; border-radius:10px; border:1px solid var(--border); padding:6px; background:var(--surface); font-size:11px; position:relative;}
.cal-cell.other{opacity:.35;}
.cal-cell.today{border:2px solid var(--turquesa);}
.cal-daynum{font-weight:700; font-size:12px; margin-bottom:4px;}
.cal-ev{border-radius:6px; padding:2px 6px; font-size:10px; margin-bottom:2px; color:#fff; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;}
.legend{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
.legend .lg-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-mut); font-weight:600;}
.legend .lg-dot{width:9px; height:9px; border-radius:50%;}

.checklist-item{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; background:var(--surface-2);}
.chk-boxes{display:flex; gap:14px; flex-wrap:wrap;}
.chk-boxes label{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--text-mut); font-weight:600;}

.progress-bar{height:6px; border-radius:6px; background:var(--surface-2); overflow:hidden; margin-top:6px;}
.progress-bar span{display:block; height:100%; border-radius:6px;}

@media print{
  .sidebar,.topbar,.no-print{display:none !important;}
  .content{padding:0;}
  body{background:#fff;}
}
</style>
</head>
<body>

<div class="toast-wrap" id="toastWrap"></div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <img class="logo" id="loginLogo" src="" alt="Yolandia Decorações">
    <p class="tag">Criamos · Decoramos · Encantamos</p>
    <div class="role-toggle">
      <button type="button" class="active" data-role="admin" onclick="selectRole('admin')">Administrador</button>
      <button type="button" data-role="funcionario" onclick="selectRole('funcionario')">Funcionário</button>
    </div>
    <div class="field">

let LOGO_PNG_CACHE = null;
function loadLogoPng(){
  return new Promise((resolve)=>{
    if(LOGO_PNG_CACHE){ resolve(LOGO_PNG_CACHE); return; }
    const img = new Image();
    img.onload = ()=>{
      try{
        const canvas = document.createElement('canvas');
        canvas.width = img.width || 400;
        canvas.height = img.height || 430;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        LOGO_PNG_CACHE = canvas.toDataURL('image/png');
      }catch(e){ LOGO_PNG_CACHE = null; }
      resolve(LOGO_PNG_CACHE);
    };
    img.onerror = ()=> resolve(null);
    img.src = LOGO_B64;
  });
}

function simpleHash(str){
  str = String(str||'');
  let hash = 5381;
  for(let i=0;i<str.length;i++){ hash = ((hash<<5)+hash) + str.charCodeAt(i); hash = hash & hash; }
  return 'h'+Math.abs(hash).toString(36)+str.length;
}

// ============ SUPABASE SYNC FUNCTIONS ============
async function loadFromSupabase(){
  try{
    const response = await fetch(`${SUPABASE_URL}/rest/v1/app_state?id=eq.yolandia_main`, {
      method:'GET',
      headers:{
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type':'application/json'
      }
    });
    if(!response.ok) throw new Error('Falha ao carregar do Supabase');
    const rows = await response.json();
    if(rows && rows.length){
      const payload = rows[0].payload;
      if(payload && typeof payload === 'object'){ 
        DB = payload; 
        migrateDB(); 
        return true; 
      }
    }
  }catch(e){ console.warn('Supabase indisponível, a usar dados locais.', e); }
  return false;
}

async function saveToSupabase(){
  try{
    const response = await fetch(`${SUPABASE_URL}/rest/v1/app_state`, {
      method:'POST',
      headers:{
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type':'application/json',
        'Prefer':'resolution=merge-duplicates'
      },
      body: JSON.stringify({id:'yolandia_main', payload: DB, updated_at: new Date().toISOString()})
    });
    if(!response.ok){ throw new Error('Falha ao guardar no Supabase'); }
  }catch(e){ console.warn('Não foi possível sincronizar com o Supabase.', e); }
}

async function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ DB = JSON.parse(raw); }
    else{ DB = seedData(); saveDB(); }
    migrateDB();
    const synced = await loadFromSupabase();
    if(!synced && !raw){ saveDB(); }
  }catch(e){
    console.error('Erro ao carregar dados, a reiniciar.', e);
    DB = seedData(); saveDB();
  }
}

function migrateDB(){
  // Migrações básicas de estrutura para garantir que nada falha

  if(!DB.config.proximoNumListaCompras) DB.config.proximoNumListaCompras=1;
  saveDB();
}

function saveDB(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));

  saveToSupabase();
}

// ============ TOAST ============
function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast '+(type||'');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 3200);
}

// ============ AUTH ============
let selectedRole = 'admin';
function selectRole(role){
  selectedRole = role;
  document.querySelectorAll('.role-toggle button').forEach(b=>b.classList.toggle('active', b.dataset.role===role));
}
function doLogin(){
  const identifier = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(!identifier || !pass){ toast('Preencha o utilizador e a senha.', 'err'); return; }
  const found = DB.users.find(u =>
    (u.user && u.user.toLowerCase()===identifier.toLowerCase()) ||
    (u.email && u.email.toLowerCase()===identifier.toLowerCase())
  );
  if(!found || found.tipo!==selectedRole){ toast('Utilizador não encontrado.', 'err'); return; }
  if(found.ativo===false){ toast('Conta inativa. Contacte o administrador.', 'err'); return; }
  if(found.senhaHash !== simpleHash(pass)){ toast('Senha incorreta.', 'err'); return; }
  DB.currentUser = found.id;
  saveDB();
  enterApp();
}
function doLogout(){
  DB.currentUser = null;
  saveDB();
  document.getElementById('appShell').classList.remove('active');
  document.getElementById('loginScreen').style.display='flex';
}
function enterApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appShell').classList.add('active');
  const u = DB.users.find(x=>x.id===DB.currentUser);
  document.getElementById('userLbl').textContent = u ? u.nome : 'Utilizador';
  document.getElementById('userAv').textContent = u ? u.nome.charAt(0).toUpperCase() : 'U';
  applyTheme();
  buildNav();
  navigate('dashboard');
}
function toggleTheme(){
  DB.config.tema = DB.config.tema==='dark' ? 'light' : 'dark';

  applyTheme();
}
function applyTheme(){
